services:
  - type: web
    name: rbx-market
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PERSISTENT_DIR
        value: /data
    disk:
      name: rbx-market-data
      mountPath: /data
      sizeGB: 1
